version: '3.8'

# ══════════════════════════════════════════════════
# LOCAL DEVELOPMENT - docker compose up --build
# ══════════════════════════════════════════════════

services:
  # ─── MySQL Database ────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: cf_mysql_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: checkfunnel_db
      MYSQL_USER: cfuser
      MYSQL_PASSWORD: cfpassword
    ports:
      - "3307:3306"     # locally DB access කරන්නත් පුළුවන් (3307 use කරනවා - 3306 locally use වෙනවා)
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS Backend ────────────────────────────
  backend:
    build:
      context: ./check-funnel-backend    # LOCAL ෙකෝ BUILD
      dockerfile: Dockerfile
    container_name: cf_backend_dev
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: checkfunnel_db
      DB_USER: cfuser
      DB_PASSWORD: cfpassword
      JWT_SECRET: local_dev_jwt_secret_32chars_min
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  # ─── React Frontend ─────────────────────────────
  frontend:
    build:
      context: ./check-funnel-frontend   # LOCAL ෙකෝ BUILD
      dockerfile: Dockerfile
    container_name: cf_frontend_dev
    restart: always
    networks:
      - app_network

  # ─── Nginx Reverse Proxy ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cf_nginx_dev
    restart: always
    ports:
      - "8080:80"       # http://localhost:8080 ෙකෝ access
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

volumes:
  mysql_dev_data:

networks:
  app_network:
    driver: bridge
