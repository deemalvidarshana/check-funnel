version: '3.8'

services:
  # ─── MySQL Database ───────────────────────────
  mysql:
    image: mysql:8.0
    container_name: cf_mysql
    ports:
      - "127.0.0.1:3306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql # data persist වෙනවා
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS Backend ───────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPO}/cf-backend:${IMAGE_TAG:-latest}
    container_name: cf_backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy # MySQL ready වෙනකන් wait
    networks:
      - app_network

  # ─── React Frontend ───────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPO}/cf-frontend:${IMAGE_TAG:-latest}
    container_name: cf_frontend
    restart: always
    networks:
      - app_network

  # ─── Nginx Reverse Proxy ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: cf_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt/:ro
      - ./certbot/www:/var/www/certbot/:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

  # ─── Certbot for SSL ───────────────────────────
  certbot:
    image: certbot/certbot
    container_name: cf_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt/:rw
      - ./certbot/www:/var/www/certbot/:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"


# ─── Volumes ────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ─── Network ────────────────────────────────────
networks:
  app_network:
    driver: bridge
