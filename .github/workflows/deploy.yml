name: 🚀 Build & Deploy to AWS Lightsail

# ─────────────────────────────────────────────────
# TRIGGER: main branch ට push කළාම auto run
# ─────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:   # GitHub UI ෙකෝ manually trigger කරන්නෙත් පුළුවන්

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════════
  # JOB 1: Docker Images Build & Push
  # ═══════════════════════════════════════════════
  build-and-push:
    name: 🔨 Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.tag.outputs.TAG }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Set image tag (short commit SHA)
        id: tag
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & Push Frontend ──────────────────
      - name: 📦 Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./check-funnel-frontend
          file: ./check-funnel-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/cf-frontend:${{ steps.tag.outputs.TAG }}
            ghcr.io/${{ env.REPO }}/cf-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & Push Backend ───────────────────
      - name: 📦 Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./check-funnel-backend
          file: ./check-funnel-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/cf-backend:${{ steps.tag.outputs.TAG }}
            ghcr.io/${{ env.REPO }}/cf-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════
  # JOB 2: Deploy to AWS Lightsail
  # ═══════════════════════════════════════════════
  deploy:
    name: 🌐 Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build-and-push   # Build job finish වෙනකන් wait

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 SSH into Lightsail & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e

            echo "📂 Moving to app directory..."
            cd /home/ubuntu/app

            echo "🔄 Pulling latest code..."
            git pull origin main

            echo "🔑 Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            echo "📥 Pulling new Docker images..."
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export GITHUB_REPO=${{ env.REPO }}

            docker pull ghcr.io/${GITHUB_REPO}/cf-frontend:${IMAGE_TAG}
            docker pull ghcr.io/${GITHUB_REPO}/cf-backend:${IMAGE_TAG}

            echo "♻️ Restarting containers..."
            IMAGE_TAG=${IMAGE_TAG} GITHUB_REPO=${GITHUB_REPO} \
              docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo "✅ Deployment complete! Version: ${IMAGE_TAG}"
